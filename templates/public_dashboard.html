<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GWL Zone Overview</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial;
    background: #f2f3f5;
    margin: 0;
}

.top-bar {
    background: white;
    padding: 15px 20px;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.top-bar h2 {
    margin: 0;
}

.public-badge {
    background: #e8f5e9;
    color: #2e7d32;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
}

.nav-btn {
    text-decoration: none;
    font-size: 14px;
    background: #333;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    display: inline-block;
    border: none;
    cursor: pointer;
}

.nav-btn:hover {
    background: #555;
}

.container {
    padding: 15px;
}

.summary-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
}

@media (min-width: 768px) {
    .summary-grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 300px));
        align-items: start;
    }
}

.zone-card {
    background: white;
    border-radius: 0 12px 12px 0;
    padding: 16px 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    cursor: pointer;
    border-left: 8px solid #f44336;
    min-height: 96px;
    display: flex;
    align-items: center;
}

.zone-card.pending {
    border-left-color: #ff9800;
}

.zone-card:hover {
    transform: translateY(-1px);
}

.zone-row {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
        "name count"
        "status status";
    column-gap: 16px;
    row-gap: 14px;
    align-items: center;
}

.zone-name {
    grid-area: name;
    font-size: 20px;
    font-weight: bold;
    color: #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.zone-count {
    grid-area: count;
    font-size: 18px;
    font-family: monospace;
    font-weight: bold;
    color: #000;
    white-space: nowrap;
}

.zone-status {
    grid-area: status;
    width: fit-content;
    font-size: 12px;
    font-family: monospace;
    font-weight: bold;
    letter-spacing: 1px;
    color: white;
    padding: 5px 9px;
    border-radius: 4px;
    background: #f44336;
}

.zone-status.pending {
    background: #ff9800;
    color: black;
}

.zone-status .timer-text {
    letter-spacing: 0;
    margin-left: 6px;
    font-weight: normal;
}

.all-good {
    background: white;
    padding: 20px;
    border-radius: 12px;
    color: #4caf50;
    font-weight: bold;
}

.all-offline {
    background: white;
    padding: 20px;
    border-radius: 12px;
    color: #999;
    font-weight: bold;
    border-left: 8px solid #999;
}

.error-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    color: #b00020;
    font-weight: bold;
    border-left: 8px solid #b00020;
}

.footer-note {
    margin-top: 15px;
    color: #666;
    font-size: 13px;
}

.empty {
    background: white;
    padding: 20px;
    border-radius: 12px;
    color: #777;
}

/* -----------------------------
   PHONE FRIENDLY DASHBOARD
----------------------------- */
@media (max-width: 767px) {
    body {
        font-size: 15px;
    }

    .top-bar {
        flex-direction: column;
        align-items: stretch;
        padding: 14px;
    }

    .top-bar h2 {
        font-size: 20px;
        line-height: 1.2;
    }

    .top-bar > div {
        width: 100%;
    }

    .nav-btn {
        width: 100%;
        text-align: center;
        padding: 12px;
        font-size: 15px;
    }

    .container {
        padding: 12px;
    }

    .summary-grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .zone-card {
        min-height: unset;
        padding: 14px;
        border-left-width: 7px;
        border-radius: 0 10px 10px 0;
    }

    .zone-row {
        grid-template-columns: 1fr;
        grid-template-areas:
            "name"
            "count"
            "status";
        row-gap: 8px;
    }

    .zone-name {
        font-size: 18px;
        white-space: normal;
        overflow: visible;
        text-overflow: unset;
        word-break: break-word;
    }

    .zone-count {
        font-size: 16px;
    }

    .zone-status {
        width: 100%;
        font-size: 12px;
        line-height: 1.4;
        white-space: normal;
        word-break: break-word;
    }

    .zone-status .timer-text {
        display: block;
        margin-left: 0;
        margin-top: 4px;
    }

    .all-good,
    .all-offline,
    .error-box,
    .empty {
        padding: 16px;
        font-size: 15px;
    }

    .footer-note {
        font-size: 12px;
        line-height: 1.4;
    }
}

</style>
</head>

<body>

<div class="top-bar">
    <div>
        <h2>GWL Zone Overview</h2>
    </div>

    <div>
        <a href="/monitor" class="nav-btn">Detailed Monitor</a>
    </div>
</div>

<div class="container">

    <div style="margin-bottom:15px;">
        <button id="pendingToggle" class="nav-btn" onclick="togglePending()">
            Show pending desync
        </button>
    </div>

    <div id="summaryGrid" class="summary-grid"></div>

    <div class="footer-note">
        Red cards mean desync occurred at least 80% of the last 15 minutes. Pending cards are hidden by default.
    </div>
</div>

<script>
let loading = false;
let zoneCards = {};
let showPending = false;

function safeId(zone) {
    return zone.replace(/[^a-zA-Z0-9_-]/g, "_");
}

function formatDuration(seconds) {
    seconds = Math.max(0, Math.floor(seconds || 0));

    const m = Math.floor(seconds / 60);
    const s = seconds % 60;

    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function togglePending() {
    showPending = !showPending;

    const btn = document.getElementById("pendingToggle");

    if (showPending) {
        btn.textContent = "Hide pending desync";
    } else {
        btn.textContent = "Show pending desync";
    }

    renderDashboard();
}

function createZoneCard(zone) {
    const id = safeId(zone);

    const card = document.createElement("div");
    card.className = "zone-card";

    card.onclick = function() {
        window.location.href = `/monitor?zone=${encodeURIComponent(zone)}`;
    };

    card.innerHTML = `
        <div class="zone-row">
            <div class="zone-name">${zone}</div>
            <div class="zone-count" id="count-${id}">- sync / -</div>
            <div class="zone-status" id="status-${id}">NOT SYNC</div>
        </div>
    `;

    return card;
}

function updateZoneCard(zone, item) {
    const id = safeId(zone);

    const card = zoneCards[zone];
    const countEl = document.getElementById(`count-${id}`);
    const statusEl = document.getElementById(`status-${id}`);

    if (!card || !countEl || !statusEl) return;

    countEl.textContent = `${item.sync} sync / ${item.total}`;

    const percentText =
        item.desync_percent !== undefined
            ? `${item.desync_percent}%`
            : "-";

    const thresholdText =
        item.threshold_percent !== undefined
            ? `${item.threshold_percent}%`
            : "80%";

    const timerText =
        `${formatDuration(item.desync_age_seconds)} / ${formatDuration(item.required_seconds)} | ${percentText} / ${thresholdText}`;

    if (item.status === "pending") {
        card.className = "zone-card pending";
        statusEl.className = "zone-status pending";
        statusEl.innerHTML = `PENDING : <span class="timer-text">${timerText}</span>`;
    } else {
        card.className = "zone-card";
        statusEl.className = "zone-status";
        statusEl.innerHTML = `NOT SYNC : <span class="timer-text">${timerText}</span>`;
    }
}

async function renderDashboard() {
    if (loading) return;

    loading = true;

    try {
        const grid = document.getElementById("summaryGrid");

        const res = await fetch("/api/dashboard_status");
        const result = await res.json();

        if (!res.ok || result.error) {
            grid.innerHTML = `
                <div class="error-box">
                    ${result.error || "Unable to load dashboard status."}
                </div>
            `;
            zoneCards = {};
            return;
        }

        if (!result.active) {
            grid.innerHTML = `
                <div class="empty">
                    Dashboard inactive. Active from 06:00 until 00:00.
                </div>
            `;
            zoneCards = {};
            return;
        }

        if (result.all_offline) {
            grid.innerHTML = `
                <div class="all-offline">
                    All zones are offline.
                </div>
            `;
            zoneCards = {};
            return;
        }

        const matureZones = result.zones || [];
        const pendingZones = result.pending_zones || [];

        const zones = showPending
            ? matureZones.concat(pendingZones)
            : matureZones;

        const activeZones = new Set(zones.map(item => item.zone));

        Object.keys(zoneCards).forEach(zone => {
            if (!activeZones.has(zone)) {
                zoneCards[zone].remove();
                delete zoneCards[zone];
            }
        });

        if (zones.length === 0) {
            if (!showPending && pendingZones.length > 0) {
                grid.innerHTML = `
                    <div class="all-good">
                        No zone has passed 15 minutes yet. ${pendingZones.length} pending desync zone(s) hidden.
                    </div>
                `;
            } else {
                grid.innerHTML = `
                    <div class="all-good">
                        All zones are fully synced.
                    </div>
                `;
            }

            zoneCards = {};
            return;
        }

        const allGoodBox = grid.querySelector(".all-good");
        if (allGoodBox) allGoodBox.remove();

        const allOfflineBox = grid.querySelector(".all-offline");
        if (allOfflineBox) allOfflineBox.remove();

        const emptyBox = grid.querySelector(".empty");
        if (emptyBox) emptyBox.remove();

        const errorBox = grid.querySelector(".error-box");
        if (errorBox) errorBox.remove();

        for (const item of zones) {
            const zone = item.zone;

            if (!zoneCards[zone]) {
                const card = createZoneCard(zone);
                zoneCards[zone] = card;
                grid.appendChild(card);
            }

            updateZoneCard(zone, item);
        }

    } catch (error) {
        const grid = document.getElementById("summaryGrid");
        grid.innerHTML = `
            <div class="error-box">
                Public UI cannot reach local proxy.
            </div>
        `;
        zoneCards = {};
    } finally {
        loading = false;
    }
}

async function init() {
    await renderDashboard();
}

setInterval(renderDashboard, 5000);

init();
</script>

</body>
</html>
