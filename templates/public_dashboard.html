<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GWL Zone Overview</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial;
    background: #f2f3f5;
    margin: 0;
}

.top-bar {
    background: white;
    padding: 15px 20px;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.top-bar h2 {
    margin: 0;
}

.public-badge {
    background: #e8f5e9;
    color: #2e7d32;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
}

.nav-btn {
    text-decoration: none;
    font-size: 14px;
    background: #333;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    display: inline-block;
    border: none;
    cursor: pointer;
}

.nav-btn:hover {
    background: #555;
}

.container {
    padding: 15px;
}

.summary-cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-bottom: 12px;
}

@media (min-width: 768px) {
    .summary-cards {
        grid-template-columns: repeat(2, minmax(150px, 170px));
    }
}

.summary-card {
    position: relative;
    background: white;
    padding: 8px 10px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border-left: 5px solid #4caf50;
    min-height: 58px;
}

.summary-card.junction {
    border-left-color: #2196f3;
}

.summary-title {
    font-size: 10px;
    color: #666;
    margin-bottom: 3px;
    font-weight: bold;
}

.summary-value {
    font-size: 17px;
    font-family: monospace;
    font-weight: bold;
    color: #000;
}

.summary-tooltip {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 50;
    width: 230px;
    max-height: 220px;
    overflow-y: auto;
    background: white;
    color: #333;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    padding: 8px;
    margin-top: 6px;
    font-size: 11px;
    line-height: 1.35;
}

.summary-card:hover .summary-tooltip {
    display: block;
}

.tooltip-title {
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 11px;
}

.tooltip-empty {
    color: #4caf50;
    font-style: italic;
}

.tooltip-item {
    border-bottom: 1px solid #eee;
    padding: 4px 0;
}

.tooltip-item:last-child {
    border-bottom: none;
}

.tooltip-sub {
    color: #777;
    font-size: 10px;
}

.summary-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
}

@media (min-width: 768px) {
    .summary-grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 300px));
        align-items: start;
    }
}

.zone-card {
    background: white;
    border-radius: 0 12px 12px 0;
    padding: 16px 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    cursor: pointer;
    border-left: 8px solid #f44336;
    min-height: 96px;
    display: flex;
    align-items: center;
}

.zone-card.pending {
    border-left-color: #ff9800;
}

.zone-card:hover {
    transform: translateY(-1px);
}

.zone-row {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
        "name count"
        "status status";
    column-gap: 16px;
    row-gap: 14px;
    align-items: center;
}

.zone-name {
    grid-area: name;
    font-size: 20px;
    font-weight: bold;
    color: #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.zone-count {
    grid-area: count;
    font-size: 18px;
    font-family: monospace;
    font-weight: bold;
    color: #000;
    white-space: nowrap;
}

.zone-status {
    grid-area: status;
    width: fit-content;
    font-size: 12px;
    font-family: monospace;
    font-weight: bold;
    letter-spacing: 1px;
    color: white;
    padding: 5px 9px;
    border-radius: 4px;
    background: #f44336;
}

.zone-status.pending {
    background: #ff9800;
    color: black;
}

.zone-status .timer-text {
    letter-spacing: 0;
    margin-left: 6px;
    font-weight: normal;
}

.all-good {
    background: white;
    padding: 20px;
    border-radius: 12px;
    color: #4caf50;
    font-weight: bold;
}

.all-offline {
    background: white;
    padding: 20px;
    border-radius: 12px;
    color: #999;
    font-weight: bold;
    border-left: 8px solid #999;
}

.error-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    color: #b00020;
    font-weight: bold;
    border-left: 8px solid #b00020;
}

.footer-note {
    margin-top: 15px;
    color: #666;
    font-size: 13px;
}

.empty {
    background: white;
    padding: 20px;
    border-radius: 12px;
    color: #777;
}

/* -----------------------------
   DARK MODE
----------------------------- */
body.dark-mode {
    background: #121212;
    color: #eaeaea;
}

body.dark-mode .top-bar {
    background: #1e1e1e;
    border-bottom-color: #333;
}

body.dark-mode .top-bar h2 {
    color: #ffffff;
}

body.dark-mode .container {
    background: #121212;
}

body.dark-mode .zone-card,
body.dark-mode .summary-card,
body.dark-mode .all-good,
body.dark-mode .all-offline,
body.dark-mode .error-box,
body.dark-mode .empty {
    background: #1e1e1e;
    color: #eaeaea;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

body.dark-mode .zone-name,
body.dark-mode .zone-count {
    color: #ffffff;
}

body.dark-mode .summary-title {
    color: #aaa;
}

body.dark-mode .summary-value {
    color: #ffffff;
}

body.dark-mode .summary-tooltip {
    background: #1e1e1e;
    color: #eaeaea;
    border-color: #444;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
}

body.dark-mode .tooltip-item {
    border-bottom-color: #333;
}

body.dark-mode .tooltip-sub {
    color: #aaa;
}

body.dark-mode .zone-card:hover {
    background: #252525;
}

body.dark-mode .footer-note {
    color: #aaa;
}

body.dark-mode .nav-btn {
    background: #444;
    color: #ffffff;
}

body.dark-mode .nav-btn:hover {
    background: #666;
}

/* -----------------------------
   PHONE FRIENDLY DASHBOARD
----------------------------- */
@media (max-width: 767px) {
    body {
        font-size: 15px;
    }

    .top-bar {
        flex-direction: column;
        align-items: stretch;
        padding: 14px;
    }

    .top-bar h2 {
        font-size: 20px;
        line-height: 1.2;
    }

    .top-bar > div {
        width: 100%;
    }

    .nav-btn {
        width: 100%;
        text-align: center;
        padding: 12px;
        font-size: 15px;
    }

    .container {
        padding: 12px;
    }

    .summary-grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .zone-card {
        min-height: unset;
        padding: 14px;
        border-left-width: 7px;
        border-radius: 0 10px 10px 0;
    }

    .zone-row {
        grid-template-columns: 1fr;
        grid-template-areas:
            "name"
            "count"
            "status";
        row-gap: 8px;
    }

    .zone-name {
        font-size: 18px;
        white-space: normal;
        overflow: visible;
        text-overflow: unset;
        word-break: break-word;
    }

    .zone-count {
        font-size: 16px;
    }

    .zone-status {
        width: 100%;
        font-size: 12px;
        line-height: 1.4;
        white-space: normal;
        word-break: break-word;
    }

    .zone-status .timer-text {
        display: block;
        margin-left: 0;
        margin-top: 4px;
    }

    .all-good,
    .all-offline,
    .error-box,
    .empty {
        padding: 16px;
        font-size: 15px;
    }

    .footer-note {
        font-size: 12px;
        line-height: 1.4;
    }
}

</style>
</head>

<body>

<div class="top-bar">
    <div>
        <h2>GWL Zone Overview</h2>
    </div>

    <div>
        <a href="/monitor" class="nav-btn">Detailed Monitor</a>
    </div>
</div>

<div class="container">

    <div class="summary-cards">
        <div class="summary-card">
            <div class="summary-title">Fully Synced Zones</div>
            <div class="summary-value" id="zoneSummary">-/-</div>

            <div class="summary-tooltip">
                <div class="tooltip-title">Desync Zones</div>
                <div id="desyncZoneList" class="tooltip-empty">No desync zone</div>
            </div>
        </div>

        <div class="summary-card junction">
            <div class="summary-title">Online Junctions</div>
            <div class="summary-value" id="junctionSummary">-/-</div>

            <div class="summary-tooltip">
                <div class="tooltip-title">Offline Junctions</div>
                <div id="offlineJunctionList" class="tooltip-empty">No offline junction</div>
            </div>
        </div>
    </div>

    <div style="margin-bottom:15px;">
        <button id="pendingToggle" class="nav-btn" onclick="togglePending()">
            Show pending desync
        </button>
    </div>

    <div id="summaryGrid" class="summary-grid"></div>

    <div class="footer-note">
        Red cards mean desync occurred at least 80% of the last 15 minutes. Pending cards are hidden by default.
    </div>
</div>

<script>
let loading = false;
let zoneCards = {};
let showPending = false;

function safeId(zone) {
    return zone.replace(/[^a-zA-Z0-9_-]/g, "_");
}

function formatDuration(seconds) {
    seconds = Math.max(0, Math.floor(seconds || 0));

    const m = Math.floor(seconds / 60);
    const s = seconds % 60;

    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function updateSummaryCards(result) {
    const zoneSummary = document.getElementById("zoneSummary");
    const junctionSummary = document.getElementById("junctionSummary");
    const desyncZoneList = document.getElementById("desyncZoneList");
    const offlineJunctionList = document.getElementById("offlineJunctionList");

    if (!zoneSummary || !junctionSummary) return;

    const fullySyncedZones = result.fully_synced_zones ?? 0;
    const totalZones = result.total_zones ?? 0;

    const onlineJunctions = result.online_junctions ?? 0;
    const totalJunctions = result.total_junctions ?? 0;

    zoneSummary.textContent = `${fullySyncedZones}/${totalZones}`;
    junctionSummary.textContent = `${onlineJunctions}/${totalJunctions}`;

    const desyncZones = result.desync_zones || [];
    const offlineJunctions = result.offline_junctions_list || [];

    if (desyncZoneList) {
        if (desyncZones.length === 0) {
            desyncZoneList.className = "tooltip-empty";
            desyncZoneList.innerHTML = "No desync zone";
        } else {
            desyncZoneList.className = "";
            desyncZoneList.innerHTML = desyncZones.map(item => `
                <div class="tooltip-item">
                    <strong>${item.zone}</strong>
                    <div class="tooltip-sub">
                        Sync: ${item.sync}/${item.total} | Offline: ${item.offline}
                    </div>
                </div>
            `).join("");
        }
    }

    if (offlineJunctionList) {
        if (offlineJunctions.length === 0) {
            offlineJunctionList.className = "tooltip-empty";
            offlineJunctionList.innerHTML = "No offline junction";
        } else {
            offlineJunctionList.className = "";
            offlineJunctionList.innerHTML = offlineJunctions.map(item => `
                <div class="tooltip-item">
                    <strong>${item.name}</strong>
                    <div class="tooltip-sub">
                        ${item.zone}
                    </div>
                </div>
            `).join("");
        }
    }
}

function togglePending() {
    showPending = !showPending;

    const btn = document.getElementById("pendingToggle");

    if (showPending) {
        btn.textContent = "Hide pending desync";
    } else {
        btn.textContent = "Show pending desync";
    }

    renderDashboard();
}

function createZoneCard(zone) {
    const id = safeId(zone);

    const card = document.createElement("div");
    card.className = "zone-card";

    card.onclick = function() {
        window.location.href = `/monitor?zone=${encodeURIComponent(zone)}`;
    };

    card.innerHTML = `
        <div class="zone-row">
            <div class="zone-name">${zone}</div>
            <div class="zone-count" id="count-${id}">- sync / -</div>
            <div class="zone-status" id="status-${id}">NOT SYNC</div>
        </div>
    `;

    return card;
}

function updateZoneCard(zone, item) {
    const id = safeId(zone);

    const card = zoneCards[zone];
    const countEl = document.getElementById(`count-${id}`);
    const statusEl = document.getElementById(`status-${id}`);

    if (!card || !countEl || !statusEl) return;

    countEl.textContent = `${item.sync} sync / ${item.total}`;

    const percentText =
        item.desync_percent !== undefined
            ? `${item.desync_percent}%`
            : "-";

    const thresholdText =
        item.threshold_percent !== undefined
            ? `${item.threshold_percent}%`
            : "80%";

    const timerText =
        `${formatDuration(item.desync_age_seconds)} / ${formatDuration(item.required_seconds)} | ${percentText} / ${thresholdText}`;

    if (item.status === "pending") {
        card.className = "zone-card pending";
        statusEl.className = "zone-status pending";
        statusEl.innerHTML = `PENDING : <span class="timer-text">${timerText}</span>`;
    } else {
        card.className = "zone-card";
        statusEl.className = "zone-status";
        statusEl.innerHTML = `NOT SYNC : <span class="timer-text">${timerText}</span>`;
    }
}

async function renderDashboard() {
    if (loading) return;

    loading = true;

    try {
        const grid = document.getElementById("summaryGrid");

        const res = await fetch("/api/dashboard_status");
        const result = await res.json();
        
        updateSummaryCards(result);

        if (!res.ok || result.error) {
            grid.innerHTML = `
                <div class="error-box">
                    ${result.error || "Unable to load dashboard status."}
                </div>
            `;
            zoneCards = {};
            return;
        }

        if (!result.active) {
            grid.innerHTML = `
                <div class="empty">
                    Dashboard inactive. Active from 06:00 until 00:00.
                </div>
            `;
            zoneCards = {};
            return;
        }

        if (result.all_offline) {
            grid.innerHTML = `
                <div class="all-offline">
                    All zones are offline.
                </div>
            `;
            zoneCards = {};
            return;
        }

        const matureZones = result.zones || [];
        const pendingZones = result.pending_zones || [];

        const zones = showPending
            ? matureZones.concat(pendingZones)
            : matureZones;

        const activeZones = new Set(zones.map(item => item.zone));

        Object.keys(zoneCards).forEach(zone => {
            if (!activeZones.has(zone)) {
                zoneCards[zone].remove();
                delete zoneCards[zone];
            }
        });

        if (zones.length === 0) {
            if (!showPending && pendingZones.length > 0) {
                grid.innerHTML = `
                    <div class="all-good">
                        No zone has passed 15 minutes yet. ${pendingZones.length} pending desync zone(s) hidden.
                    </div>
                `;
            } else {
                grid.innerHTML = `
                    <div class="all-good">
                        All zones are fully synced.
                    </div>
                `;
            }

            zoneCards = {};
            return;
        }

        const allGoodBox = grid.querySelector(".all-good");
        if (allGoodBox) allGoodBox.remove();

        const allOfflineBox = grid.querySelector(".all-offline");
        if (allOfflineBox) allOfflineBox.remove();

        const emptyBox = grid.querySelector(".empty");
        if (emptyBox) emptyBox.remove();

        const errorBox = grid.querySelector(".error-box");
        if (errorBox) errorBox.remove();

        for (const item of zones) {
            const zone = item.zone;

            if (!zoneCards[zone]) {
                const card = createZoneCard(zone);
                zoneCards[zone] = card;
                grid.appendChild(card);
            }

            updateZoneCard(zone, item);
        }

    } catch (error) {
        const grid = document.getElementById("summaryGrid");
        grid.innerHTML = `
            <div class="error-box">
                Public UI cannot reach local proxy.
            </div>
        `;
        zoneCards = {};
    } finally {
        loading = false;
    }
}

async function init() {
    await renderDashboard();
}

setInterval(renderDashboard, 5000);

function applyDarkModeSetting() {
    const enabled = localStorage.getItem("publicDarkMode") === "true";

    document.body.classList.toggle("dark-mode", enabled);
}

applyDarkModeSetting();

init();
</script>

</body>
</html>
